[package]
name = "batto"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "batto"
path = "src/bin/batto.rs"

[[bin]]
name = "battod"
path = "src/bin/battod.rs"

[dependencies]
gpui = "0.2.2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freedesktop-desktop-entry = "0.8.1"
mlua = { version = "0.11", features = ["lua54", "vendored", "serde"] }
nucleo-matcher = "0.3"
libc = "0.2"
meval = "0.2"
